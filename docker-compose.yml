services:
  postgres:
    image: postgres:17-alpine
    container_name: dblens-postgres
    # pg_stat_statements records the workload find_hot_queries and infer_relationships read.
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpassword}
      POSTGRES_DB: ${POSTGRES_DB:-dblens_demo}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-dblens_demo}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - dblens-net

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: dblens-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-DevPassword123!}
      MSSQL_PID: ${MSSQL_PID:-Developer}
    ports:
      - "1434:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"${MSSQL_SA_PASSWORD:-DevPassword123!}\" -Q 'SELECT 1' -No -C 2>/dev/null || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s
    networks:
      - dblens-net

  sqlserver-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: dblens-sqlserver-init
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-DevPassword123!}
    volumes:
      - ./db/sqlserver:/usr/src/scripts:ro
    entrypoint: ["/bin/bash", "/usr/src/scripts/init.sh"]
    networks:
      - dblens-net
    restart: "no"

volumes:
  postgres_data:
  sqlserver_data:

networks:
  dblens-net:
    driver: bridge
