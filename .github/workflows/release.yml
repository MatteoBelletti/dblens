name: Release

# Push a tag such as v0.1.0 to publish, or run it by hand (Actions → Release → Run workflow) with a
# version: the release then creates the tag on the commit it built. The workflow builds self-contained binaries, one Claude
# Desktop extension (.mcpb) per platform and the NuGet tool package, then creates the GitHub
# release. The package goes to nuget.org through Trusted Publishing (GitHub OIDC, no stored API key)
# once the NUGET_USER secret holds the nuget.org profile name; until then the step is skipped.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 0.4.0 (tagged v0.4.0)"
        required: true

permissions:
  contents: write
  id-token: write   # OIDC token for NuGet Trusted Publishing

env:
  DOTNET_CLI_UI_LANGUAGE: en
  DOTNET_NOLOGO: "true"

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NUGET_USER: ${{ secrets.NUGET_USER }}   # nuget.org profile name, not the e-mail address

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Version from the tag or the input
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then version="$INPUT_VERSION"; else version="${GITHUB_REF_NAME#v}"; fi
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "Not a version: $version"; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "TAG=v$version" >> "$GITHUB_ENV"

      # By hand, only the default branch is released, never twice under one version.
      - name: Guard a hand-run release
        if: github.event_name == 'workflow_dispatch'
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          [ "$GITHUB_REF" = "refs/heads/$DEFAULT_BRANCH" ] || { echo "Run it from $DEFAULT_BRANCH, not $GITHUB_REF"; exit 1; }
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null; then echo "$TAG already exists"; exit 1; fi

      - name: Test (engines)
        run: |
          dotnet test -c Release \
            --filter "FullyQualifiedName!~Postgres&FullyQualifiedName!~SqlServer"

      - name: Publish binaries and build extensions
        run: |
          set -euo pipefail
          mkdir -p dist
          for rid in win-x64 linux-x64 osx-arm64; do
            case "$rid" in
              win-*)   entry=DbLens.Mcp.exe; platform=win32 ;;
              linux-*) entry=DbLens.Mcp;     platform=linux ;;
              osx-*)   entry=DbLens.Mcp;     platform=darwin ;;
            esac

            out="build/$rid"
            dotnet publish src/DbLens.Mcp -c Release -r "$rid" --self-contained \
              -p:PublishSingleFile=true -p:Version="$VERSION" \
              -p:DebugType=none -p:IsTransformWebConfigDisabled=true -o "$out/server"

            # IIS and static-asset leftovers of the Web SDK; a stdio server needs neither.
            rm -f "$out/server/aspnetcorev2_inprocess.dll" "$out/server/"*.staticwebassets.endpoints.json

            (cd "$out/server" && zip -qr "$GITHUB_WORKSPACE/dist/dblens-$VERSION-$rid.zip" .)

            sed -e "s/__VERSION__/$VERSION/" -e "s/__ENTRY__/$entry/g" -e "s/__PLATFORM__/$platform/" \
              packaging/mcpb/manifest.json > "$out/manifest.json"
            cp LICENSE "$out/"
            (cd "$out" && zip -qr "$GITHUB_WORKSPACE/dist/dblens-$VERSION-$rid.mcpb" manifest.json LICENSE server)
          done

      - name: Pack NuGet tool
        run: |
          sed -i "s/\"version\": \"[^\"]*\"/\"version\": \"$VERSION\"/g" src/DbLens.Mcp/.mcp/server.json
          dotnet pack src/DbLens.Mcp -c Release -p:Version="$VERSION" -o dist

      # The tag exists before anything irreversible: the NuGet package then always matches a tag.
      - name: Tag the commit (hand-run)
        if: github.event_name == 'workflow_dispatch'
        run: |
          git tag "$TAG" "$GITHUB_SHA"
          git push origin "$TAG"

      # The temporary key lives one hour and each OIDC token buys one key, so log in right before pushing.
      - name: NuGet login (OIDC -> temporary API key)
        id: nuget-login
        if: env.NUGET_USER != ''
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to nuget.org
        if: steps.nuget-login.outcome == 'success'
        run: >
          dotnet nuget push "dist/*.nupkg"
          --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json --skip-duplicate

      # A re-run (e.g. to retry the NuGet push) finds the release already there: replace its files
      # instead of failing.
      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "dblens $VERSION" --generate-notes
          fi
