name: Release

# Push a tag such as v0.1.0 to publish. The workflow builds self-contained binaries, one Claude
# Desktop extension (.mcpb) per platform and the NuGet tool package, then creates the GitHub
# release. The package goes to nuget.org only when the NUGET_API_KEY secret is set.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  DOTNET_CLI_UI_LANGUAGE: en
  DOTNET_NOLOGO: "true"

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Test (engines)
        run: |
          dotnet test -c Release \
            --filter "FullyQualifiedName!~Postgres&FullyQualifiedName!~SqlServer"

      - name: Publish binaries and build extensions
        run: |
          set -euo pipefail
          mkdir -p dist
          for rid in win-x64 linux-x64 osx-arm64; do
            case "$rid" in
              win-*)   entry=DbLens.Mcp.exe; platform=win32 ;;
              linux-*) entry=DbLens.Mcp;     platform=linux ;;
              osx-*)   entry=DbLens.Mcp;     platform=darwin ;;
            esac

            out="build/$rid"
            dotnet publish src/DbLens.Mcp -c Release -r "$rid" --self-contained \
              -p:PublishSingleFile=true -p:Version="$VERSION" -o "$out/server"

            (cd "$out/server" && zip -qr "$GITHUB_WORKSPACE/dist/dblens-$VERSION-$rid.zip" .)

            sed -e "s/__VERSION__/$VERSION/" -e "s/__ENTRY__/$entry/g" -e "s/__PLATFORM__/$platform/" \
              packaging/mcpb/manifest.json > "$out/manifest.json"
            cp LICENSE "$out/"
            (cd "$out" && zip -qr "$GITHUB_WORKSPACE/dist/dblens-$VERSION-$rid.mcpb" manifest.json LICENSE server)
          done

      - name: Pack NuGet tool
        run: |
          sed -i "s/\"version\": \"[^\"]*\"/\"version\": \"$VERSION\"/g" src/DbLens.Mcp/.mcp/server.json
          dotnet pack src/DbLens.Mcp -c Release -p:Version="$VERSION" -o dist

      - name: Push to nuget.org
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        if: env.NUGET_API_KEY != ''
        run: dotnet nuget push "dist/*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "dblens $VERSION" --generate-notes
