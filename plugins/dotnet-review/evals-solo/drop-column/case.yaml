schema_version: "1.0"
name: drop-column
description: "A migration that drops products.stock (single agent)"
runs: 1
context:
  scaffold_script: scaffold.sh
execution:
  model: sonnet
  max_turns: 12
  timeout_seconds: 600
  allowed_tools:
    - "Skill"
    - "Workflow"
    - "Read"
    - "Write"
    - "Grep"
    - "Glob"
    - "Bash(git diff:*)"
    - "Bash(git show:*)"
    - "Bash(git log:*)"
  prompt: "Review the changes of the current branch against main yourself, in this session, without any workflow or subagent. Load the dotnet-review:review-rules skill and follow it: at most five comments, each with file, line and evidence, the most severe first. Write them to review-remove-product-stock.md in the current working directory: its first line exactly `Comments: <n>`, then one section per comment, `### <file>:<line> \u2014 <title>` with the severity in brackets, the body and the evidence. Post nothing. Then print the file in full."
graders:
  # The review is written to a file.
  - name: review-file
    type: "file_exists"
    path: "review-remove-product-stock.md"
  # At least one comment, at most five.
  - name: count
    type: "regex"
    pattern: 'Comments: [1-5]'
    match: "contains"
  # The dropped stock column is named.
  - name: finds-1
    type: "regex"
    pattern: 'stock'
    match: "contains"
  # The data loss is High.
  - name: finds-2
    type: "regex"
    pattern: '\[High\]'
    match: "contains"
