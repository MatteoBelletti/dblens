schema_version: "1.0"
name: clean
description: "Only doc comments change: nothing to say (single agent)"
runs: 1
context:
  scaffold_script: scaffold.sh
execution:
  model: sonnet
  max_turns: 12
  timeout_seconds: 600
  allowed_tools:
    - "Skill"
    - "Workflow"
    - "Read"
    - "Write"
    - "Grep"
    - "Glob"
    - "Bash(git diff:*)"
    - "Bash(git show:*)"
    - "Bash(git log:*)"
  prompt: "Review the changes of the current branch against main yourself, in this session, without any workflow or subagent. Load the dotnet-review:review-rules skill and follow it: at most five comments, each with file, line and evidence, the most severe first. Write them to review-model-comments.md in the current working directory: its first line exactly `Comments: <n>`, then one section per comment, `### <file>:<line> \u2014 <title>` with the severity in brackets, the body and the evidence. Post nothing. Then print the file in full."
graders:
  # The review is written to a file.
  - name: review-file
    type: "file_exists"
    path: "review-model-comments.md"
  # Nothing to say on a clean change.
  - name: count
    type: "regex"
    pattern: 'Comments: 0'
    match: "contains"
