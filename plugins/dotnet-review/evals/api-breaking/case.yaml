schema_version: "1.0"
name: api-breaking
description: "A public DTO loses Status and renames Total"
runs: 1
context:
  scaffold_script: scaffold.sh
execution:
  model: sonnet
  max_turns: 12
  timeout_seconds: 600
  allowed_tools:
    - "Skill"
    - "Workflow"
    - "Read"
    - "Write"
    - "Grep"
    - "Glob"
    - "Bash(git diff:*)"
    - "Bash(git show:*)"
    - "Bash(git log:*)"
  prompt: "Run the dotnet-review review workflow with args {\"base\": \"main\", \"branch\": \"orders-api-v2\", \"outDir\": \"<the absolute path of the current working directory>\"}. When it finishes, Read review-orders-api-v2.md and print it in full."
graders:
  # The review is written to a file.
  - name: review-file
    type: "file_exists"
    path: "review-orders-api-v2.md"
  # At least one comment, at most five.
  - name: count
    type: "regex"
    pattern: 'Comments: [1-5]'
    match: "contains"
  # The change is called breaking.
  - name: finds-1
    type: "regex"
    pattern: '[Bb]reak|[Cc]lient'
    match: "contains"
  # The removed or renamed field is named.
  - name: finds-2
    type: "regex"
    pattern: 'Total|Status'
    match: "contains"
