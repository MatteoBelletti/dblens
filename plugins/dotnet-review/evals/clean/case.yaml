schema_version: "1.0"
name: clean
description: "Only doc comments change: nothing to say"
runs: 1
context:
  scaffold_script: scaffold.sh
execution:
  model: sonnet
  max_turns: 12
  timeout_seconds: 600
  allowed_tools:
    - "Skill"
    - "Workflow"
    - "Read"
    - "Write"
    - "Grep"
    - "Glob"
    - "Bash(git diff:*)"
    - "Bash(git show:*)"
    - "Bash(git log:*)"
  prompt: "Run the dotnet-review review workflow with args {\"base\": \"main\", \"branch\": \"model-comments\", \"outDir\": \"<the absolute path of the current working directory>\"}. When it finishes, Read review-model-comments.md and print it in full."
graders:
  # The review is written to a file.
  - name: review-file
    type: "file_exists"
    path: "review-model-comments.md"
  # Nothing to say on a clean change.
  - name: count
    type: "regex"
    pattern: 'Comments: 0'
    match: "contains"
