schema_version: "1.0"
name: rename-column
description: "A migration that renames orders.status"
runs: 1
context:
  scaffold_script: scaffold.sh
execution:
  model: sonnet
  max_turns: 12
  timeout_seconds: 600
  allowed_tools:
    - "Skill"
    - "Workflow"
    - "Read"
    - "Write"
    - "Grep"
    - "Glob"
    - "Bash(git diff:*)"
    - "Bash(git show:*)"
    - "Bash(git log:*)"
  prompt: "Run the dotnet-review review workflow with args {\"base\": \"main\", \"branch\": \"rename-order-status\", \"outDir\": \"<the absolute path of the current working directory>\"}. When it finishes, Read review-rename-order-status.md and print it in full."
graders:
  # The review is written to a file.
  - name: review-file
    type: "file_exists"
    path: "review-rename-order-status.md"
  # At least one comment, at most five.
  - name: count
    type: "regex"
    pattern: 'Comments: [1-5]'
    match: "contains"
  # The rename is flagged.
  - name: finds-1
    type: "regex"
    pattern: '[Rr]enam'
    match: "contains"
  # The renamed column is named.
  - name: finds-2
    type: "regex"
    pattern: 'status'
    match: "contains"
