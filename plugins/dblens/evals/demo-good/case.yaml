schema_version: "1.0"
name: demo-good
description: "The audit of the dblens demo database, run on a named connection"
runs: 1
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 12
  timeout_seconds: 600
  allowed_tools:
    - "Skill"
    - "Workflow"
    - "Read"
    - "Write"
    - "Glob"
    - "ToolSearch"
    - "mcp__plugin_dblens_dblens__ping"
    - "mcp__plugin_dblens_dblens__get_schema"
    - "mcp__plugin_dblens_dblens__get_table_details"
    - "mcp__plugin_dblens_dblens__analyze_indexes"
    - "mcp__plugin_dblens_dblens__analyze_fragmentation"
    - "mcp__plugin_dblens_dblens__analyze_table_hygiene"
    - "mcp__plugin_dblens_dblens__analyze_denormalization"
    - "mcp__plugin_dblens_dblens__infer_relationships"
    - "mcp__plugin_dblens_dblens__check_cascade_paths"
    - "mcp__plugin_dblens_dblens__find_hot_queries"
    - "mcp__plugin_dblens_dblens__explain_query"
    - "mcp__plugin_dblens_dblens__compare_ef_model"
    - "mcp__plugin_dblens_dblens__check_migration_safety"
    - "mcp__plugin_dblens_dblens__scan_gdpr"
  prompt: "Run the dblens audit workflow (dblens:run-audit) with args {\"dialect\": \"PostgreSql\", \"connection\": \"eval-demo-pg\", \"expectedDatabase\": \"dblens_demo\", \"schema\": \"demo_good\", \"outDir\": \"./dblens-audit\", \"runLabel\": \"eval-good\"}. When it finishes, Read the Markdown report it wrote and print it in full."
graders:
  # Every agent ran and every finding was re-checked: a zero from an audit that did nothing is not a pass.
  - name: all-ran
    type: "regex"
    pattern: 'unverified: 0, agents failed: 0'
    match: "contains"
  # demo_good has no confirmed finding.
  - name: confirmed-zero
    type: "regex"
    pattern: 'Confirmed findings: 0\b'
    match: "contains"
  # The report is written to the output folder.
  - name: report-file
    type: "file_exists"
    path: "dblens-audit/dblens-audit-eval-good.md"
  # The report opens with the database it audited.
  - name: names-the-target
    type: "regex"
    pattern: 'dblens_demo'
    match: "contains"
