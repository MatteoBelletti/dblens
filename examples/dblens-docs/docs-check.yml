# Fails a pull request whose code and project documents disagree.
#
# The documents under docs/project are generated by `dblens-docs scaffold` and committed. When a pull
# request adds an endpoint, drops an entity or changes a project, the check fails until the author runs
# `dblens-docs scaffold` and commits the result; the diff of docs/project is then part of the review.
name: project docs

on:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install dblens-docs
        run: dotnet tool install --global DbLens.Docs.Cli --version 0.1.0

      # A missing item, an item that left the code, a changed item whose region was not regenerated, a
      # generated region edited by hand, or a slot over its limit: exit code 1. Empty and stale slots are
      # warnings here; add --strict to fail on stale or missing ones, --require-slots on empty or missing ones.
      - name: Check the project documents
        run: dblens-docs check
